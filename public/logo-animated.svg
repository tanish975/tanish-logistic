<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img">
  <title>Tanish Logistic</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9ecc0"/>
      <stop offset="38%" stop-color="#e8c877"/>
      <stop offset="72%" stop-color="#c79b4a"/>
      <stop offset="100%" stop-color="#9a7231"/>
    </linearGradient>
    <linearGradient id="ringGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2dd9e"/>
      <stop offset="55%" stop-color="#cba355"/>
      <stop offset="100%" stop-color="#8a6828"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1a1206" flood-opacity="0.35"/>
    </filter>
    <clipPath id="monoClip">
      <path d="M118,140 H284 L294,152 V170 H223 V350 H189 V170 H118 Z"/>
      <path d="M294,140 H328 V316 H384 L400,350 H294 Z"/>
    </clipPath>
  </defs>
  <style>
    .ring { stroke-dasharray: 1458; stroke-dashoffset: 1458; animation: draw 1.1s cubic-bezier(.55,0,.15,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .mono { opacity: 0; transform: translateY(12px); animation: rise .8s ease-out .3s forwards; }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    .orbit { opacity: 0; animation: fade .8s ease-out .55s forwards; }
    @keyframes fade { to { opacity: 1; } }
    .road { opacity: 0; animation: fadein .7s ease-out .75s forwards; }
    @keyframes fadein { to { opacity: 1; } }
    .shine { transform: translateX(-240px); animation: sweep 6s ease-in-out 1.8s infinite; }
    @keyframes sweep { 0%, 45% { transform: translateX(-240px); } 72%, 100% { transform: translateX(760px); } }
    @media (prefers-reduced-motion: reduce) { .shine { animation: none; } }
  </style>

  <!-- Fine outer ring -->
  <circle class="ring" cx="256" cy="256" r="232" fill="none" stroke="url(#ringGold)" stroke-width="3.5"/>

  <!-- Dotted transit orbit with travelling route marker -->
  <g class="orbit">
    <circle cx="256" cy="256" r="210" fill="none" stroke="#d9b566" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="2.5 16" stroke-linecap="round"/>
    <circle cx="256" cy="46" r="9" fill="#f2dd9e" opacity="0.25"/>
    <circle cx="256" cy="46" r="5" fill="#f2dd9e"/>
    <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="40s" repeatCount="indefinite"/>
  </g>

  <!-- Road ribbon with marching lane dashes -->
  <path class="road" d="M102,396 Q246,344 390,396" fill="none" stroke="url(#ringGold)" stroke-width="7" stroke-linecap="round" stroke-dasharray="30 20">
    <animate attributeName="stroke-dashoffset" from="0" to="-50" dur="2.2s" repeatCount="indefinite"/>
  </path>

  <!-- Elegant TL monogram -->
  <g class="mono" filter="url(#softShadow)" stroke="#8a6828" stroke-width="1">
    <path d="M118,140 H284 L294,152 V170 H223 V350 H189 V170 H118 Z" fill="url(#gold)"/>
    <path d="M294,140 H328 V316 H384 L400,350 H294 Z" fill="url(#gold)"/>
  </g>

  <!-- Gold shimmer sweep across the letters -->
  <g clip-path="url(#monoClip)">
    <rect class="shine" x="20" y="110" width="80" height="260" fill="url(#shine)"/>
  </g>
</svg>
