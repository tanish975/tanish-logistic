<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fef08a" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      .glint-dot { display: none !important; }
    }
  </style>

  <!-- Ambient glow strokes -->
  <g fill="none" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#goldGlow)">
    <path d="M 34.4,199.8 C 27.1,183 29.2,162 40.8,147.3 C 52.3,134.7 76.4,131.6 115.3,125.3 C 167.8,116.9 225.6,102.2 286.4,75.9 C 311.6,65.4 332.6,46.5 334.8,32.9" stroke-width="12" stroke-dasharray="420" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="420" to="0" dur="0.6s" begin="0.15s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1" />
    </path>
    <path d="M 334.8,32.9 C 343.1,38.1 343.1,48.6 332.6,61.2 C 311.6,86.4 275.9,115.8 241.3,149.4 C 202.4,196.7 162.6,285.9 110,417.2" stroke-width="25" stroke-dasharray="520" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="520" to="0" dur="0.6s" begin="0.70s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1" />
    </path>
    <path d="M 279.1,156.8 C 270.7,189.3 258.1,235.5 247.6,275.4 C 237.1,315.3 226.6,346.8 219.3,367.8" stroke-width="11" stroke-dasharray="280" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="280" to="0" dur="0.5s" begin="1.25s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1" />
    </path>
    <path d="M 219.3,367.8 C 208.8,382.5 181.4,407.7 160.4,417.2 C 155.2,420.3 158.3,426.6 170.9,426.6 C 188.8,426.6 206.7,406.7 231.8,378.3 C 262.3,371 309.6,382.5 362.1,389.9 C 409.3,389.9 446.1,369.9 482.8,310.1" stroke-width="21" stroke-dasharray="520" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="520" to="0" dur="0.65s" begin="1.70s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1" />
    </path>
  </g>

  <!-- Sharp primary calligraphy strokes -->
  <g fill="none" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 34.4,199.8 C 27.1,183 29.2,162 40.8,147.3 C 52.3,134.7 76.4,131.6 115.3,125.3 C 167.8,116.9 225.6,102.2 286.4,75.9 C 311.6,65.4 332.6,46.5 334.8,32.9" stroke-width="9.5" stroke-dasharray="420" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="420" to="0" dur="0.6s" begin="0.15s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1" />
    </path>
    <path d="M 334.8,32.9 C 343.1,38.1 343.1,48.6 332.6,61.2 C 311.6,86.4 275.9,115.8 241.3,149.4 C 202.4,196.7 162.6,285.9 110,417.2" stroke-width="21" stroke-dasharray="520" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="520" to="0" dur="0.6s" begin="0.70s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1" />
    </path>
    <path d="M 279.1,156.8 C 270.7,189.3 258.1,235.5 247.6,275.4 C 237.1,315.3 226.6,346.8 219.3,367.8" stroke-width="9" stroke-dasharray="280" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="280" to="0" dur="0.5s" begin="1.25s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1" />
    </path>
    <path d="M 219.3,367.8 C 208.8,382.5 181.4,407.7 160.4,417.2 C 155.2,420.3 158.3,426.6 170.9,426.6 C 188.8,426.6 206.7,406.7 231.8,378.3 C 262.3,371 309.6,382.5 362.1,389.9 C 409.3,389.9 446.1,369.9 482.8,310.1" stroke-width="18" stroke-dasharray="520" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="520" to="0" dur="0.65s" begin="1.70s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1" />
    </path>
  </g>

  <!-- Pen glints along the monogram -->
  <g>
    <!-- Glint at T bar crest -->
    <circle class="glint-dot" cx="334" cy="51" r="9" fill="url(#glint)" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.35;0.38;0.43;1" dur="7s" repeatCount="indefinite" begin="2.6s" />
      <animateTransform attributeName="transform" type="scale" values="0.4;0.4;1.15;0.6;0.4" keyTimes="0;0.35;0.38;0.43;1" dur="7s" repeatCount="indefinite" begin="2.6s" additive="sum" />
    </circle>
    <!-- Glint down T stem -->
    <circle class="glint-dot" cx="240" cy="180" r="10" fill="url(#glint)" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.39;0.42;0.47;1" dur="7s" repeatCount="indefinite" begin="2.6s" />
      <animateTransform attributeName="transform" type="scale" values="0.4;0.4;1.15;0.6;0.4" keyTimes="0;0.39;0.42;0.47;1" dur="7s" repeatCount="indefinite" begin="2.6s" additive="sum" />
    </circle>
    <!-- Glint at L bottom loop -->
    <circle class="glint-dot" cx="170" cy="445" r="9" fill="url(#glint)" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.44;0.47;0.52;1" dur="7s" repeatCount="indefinite" begin="2.6s" />
      <animateTransform attributeName="transform" type="scale" values="0.4;0.4;1.15;0.6;0.4" keyTimes="0;0.44;0.47;0.52;1" dur="7s" repeatCount="indefinite" begin="2.6s" additive="sum" />
    </circle>
    <!-- Glint at L exit tip -->
    <circle class="glint-dot" cx="478" cy="326" r="9" fill="url(#glint)" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.48;0.51;0.56;1" dur="7s" repeatCount="indefinite" begin="2.6s" />
      <animateTransform attributeName="transform" type="scale" values="0.4;0.4;1.15;0.6;0.4" keyTimes="0;0.48;0.51;0.56;1" dur="7s" repeatCount="indefinite" begin="2.6s" additive="sum" />
    </circle>
  </g>
</svg>
