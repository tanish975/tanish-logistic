<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img">
  <title>Tanish Logistic</title>
  <defs>
    <linearGradient id="gold" x1="256" y1="130" x2="256" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f9ecc0"/>
      <stop offset="38%" stop-color="#e8c877"/>
      <stop offset="72%" stop-color="#c79b4a"/>
      <stop offset="100%" stop-color="#9a7231"/>
    </linearGradient>
    <linearGradient id="ringGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2dd9e"/>
      <stop offset="55%" stop-color="#cba355"/>
      <stop offset="100%" stop-color="#8a6828"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1a1206" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .ring { stroke-dasharray: 1458; stroke-dashoffset: 1458; animation: draw 1.1s cubic-bezier(.55,0,.15,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* TL written stroke by stroke, like a signature */
    .lt { stroke-dasharray: 100; stroke-dashoffset: 100; animation: write .5s cubic-bezier(.55,0,.25,1) forwards; }
    .l1 { animation-delay: .3s; }
    .l2 { animation-delay: .55s; }
    .l3 { animation-delay: .8s; }
    .l4 { animation-delay: 1s; }
    @keyframes write { to { stroke-dashoffset: 0; } }

    /* bright pen-tip retraces the letters every cycle */
    .gl { stroke-dasharray: 16 240; stroke-dashoffset: 16; opacity: 0; animation: retrace 7s linear infinite; }
    .g1 { animation-delay: 2.6s; }
    .g2 { animation-delay: 2.85s; }
    .g3 { animation-delay: 3.1s; }
    .g4 { animation-delay: 3.32s; }
    @keyframes retrace {
      0% { stroke-dashoffset: 16; opacity: 0; }
      1% { opacity: 1; }
      6% { stroke-dashoffset: -116; opacity: 1; }
      7%, 100% { stroke-dashoffset: -116; opacity: 0; }
    }

    .orbit { opacity: 0; animation: fade .8s ease-out .55s forwards; }
    @keyframes fade { to { opacity: 1; } }
    .road { opacity: 0; animation: fadein .7s ease-out .75s forwards; }
    @keyframes fadein { to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .gl { animation: none; }
      .lt { animation: none; stroke-dashoffset: 0; }
    }
  </style>

  <!-- Fine outer ring -->
  <circle class="ring" cx="256" cy="256" r="232" fill="none" stroke="url(#ringGold)" stroke-width="3.5"/>

  <!-- Dotted transit orbit with travelling route marker -->
  <g class="orbit">
    <circle cx="256" cy="256" r="210" fill="none" stroke="#d9b566" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="2.5 16" stroke-linecap="round"/>
    <circle cx="256" cy="46" r="9" fill="#f2dd9e" opacity="0.25"/>
    <circle cx="256" cy="46" r="5" fill="#f2dd9e"/>
    <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="40s" repeatCount="indefinite"/>
  </g>

  <!-- Road ribbon with marching lane dashes -->
  <path class="road" d="M102,396 Q246,344 390,396" fill="none" stroke="url(#ringGold)" stroke-width="7" stroke-linecap="round" stroke-dasharray="30 20">
    <animate attributeName="stroke-dashoffset" from="0" to="-50" dur="2.2s" repeatCount="indefinite"/>
  </path>

  <!-- Hand-written TL monogram (subtle forward slant) -->
  <g transform="translate(-26,0) skewX(6)" filter="url(#softShadow)">
    <g stroke="url(#gold)" stroke-width="22" stroke-linecap="round" fill="none">
      <path class="lt l1" pathLength="100" d="M212,144 C192,214 222,282 200,354"/>
      <path class="lt l2" pathLength="100" d="M113,162 C172,138 248,140 301,150"/>
      <path class="lt l3" pathLength="100" d="M307,144 C290,214 316,280 296,338"/>
      <path class="lt l4" pathLength="100" d="M296,338 C288,356 304,364 342,358 C374,353 396,342 408,322"/>
    </g>
    <!-- pen-tip glint retracing the strokes -->
    <g stroke="#fff7da" stroke-width="22" stroke-linecap="round" fill="none">
      <path class="gl g1" pathLength="100" d="M212,144 C192,214 222,282 200,354"/>
      <path class="gl g2" pathLength="100" d="M113,162 C172,138 248,140 301,150"/>
      <path class="gl g3" pathLength="100" d="M307,144 C290,214 316,280 296,338"/>
      <path class="gl g4" pathLength="100" d="M296,338 C288,356 304,364 342,358 C374,353 396,342 408,322"/>
    </g>
  </g>
</svg>
