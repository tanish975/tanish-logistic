<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img">
  <title>Tanish Logistic</title>
  <defs>
    <linearGradient id="gold" x1="256" y1="110" x2="256" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f9ecc0"/>
      <stop offset="38%" stop-color="#e8c877"/>
      <stop offset="72%" stop-color="#c79b4a"/>
      <stop offset="100%" stop-color="#9a7231"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1a1206" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    /* Slanted cursive TL written stroke by stroke, like the reference */
    .lt { stroke-dasharray: 100; stroke-dashoffset: 100; animation: write .5s cubic-bezier(.55,0,.25,1) forwards; }
    .l1 { animation-delay: .25s; }
    .l2 { animation-delay: .55s; }
    .l3 { animation-delay: .85s; animation-duration: .55s; }
    .l4 { animation-delay: 1.2s; animation-duration: .45s; }
    .l5 { animation-delay: 1.5s; animation-duration: .55s; }
    @keyframes write { to { stroke-dashoffset: 0; } }

    /* bright pen-tip retraces the strokes every cycle */
    .gl { stroke-dasharray: 16 240; stroke-dashoffset: 16; opacity: 0; animation: retrace 7s linear infinite; }
    .g1 { animation-delay: 2.6s; }
    .g2 { animation-delay: 2.85s; }
    .g3 { animation-delay: 3.1s; }
    .g4 { animation-delay: 3.35s; }
    .g5 { animation-delay: 3.6s; }
    @keyframes retrace {
      0% { stroke-dashoffset: 16; opacity: 0; }
      1% { opacity: 1; }
      6% { stroke-dashoffset: -116; opacity: 1; }
      7%, 100% { stroke-dashoffset: -116; opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .gl { animation: none; }
      .lt { animation: none; stroke-dashoffset: 0; }
    }
  </style>

  <!-- Slanted cursive TL monogram (from the reference design) -->
  <g filter="url(#softShadow)">
    <g stroke="url(#gold)" stroke-linecap="round" fill="none">
      <path class="lt l1" pathLength="100" stroke-width="15" d="M51,251 C36,247 32,231 45,225 C89,203 148,185 203,176 C247,169 278,163 302,162 C313,161 318,167 313,175"/>
      <path class="lt l2" pathLength="100" stroke-width="17" d="M245,167 C238,227 230,288 216,343 C210,370 199,387 181,392 C175,394 170,389 172,382"/>
      <path class="lt l3" pathLength="100" stroke-width="14" d="M381,115 C414,119 439,143 441,178 C443,214 421,244 386,249 C353,252 329,231 326,200 C325,178 340,159 362,152"/>
      <path class="lt l4" pathLength="100" stroke-width="21" d="M337,238 C329,286 318,332 302,365 C297,378 289,385 278,389"/>
      <path class="lt l5" pathLength="100" stroke-width="21" d="M278,389 C287,400 307,406 333,404 C379,400 436,391 476,372 C485,368 489,361 489,353"/>
    </g>
    <!-- pen-tip glint retracing the strokes -->
    <g stroke="#fff7da" stroke-linecap="round" fill="none">
      <path class="gl g1" pathLength="100" stroke-width="15" d="M51,251 C36,247 32,231 45,225 C89,203 148,185 203,176 C247,169 278,163 302,162 C313,161 318,167 313,175"/>
      <path class="gl g2" pathLength="100" stroke-width="17" d="M245,167 C238,227 230,288 216,343 C210,370 199,387 181,392 C175,394 170,389 172,382"/>
      <path class="gl g3" pathLength="100" stroke-width="14" d="M381,115 C414,119 439,143 441,178 C443,214 421,244 386,249 C353,252 329,231 326,200 C325,178 340,159 362,152"/>
      <path class="gl g4" pathLength="100" stroke-width="21" d="M337,238 C329,286 318,332 302,365 C297,378 289,385 278,389"/>
      <path class="gl g5" pathLength="100" stroke-width="21" d="M278,389 C287,400 307,406 333,404 C379,400 436,391 476,372 C485,368 489,361 489,353"/>
    </g>
  </g>
</svg>
