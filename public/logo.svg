      <path stroke-width="30" d="M245,178 C238,236 230,295 216,348 C210,372 199,389 183,392"/>
      <path stroke-width="18" d="M381,115 C414,119 439,143 441,178 C443,214 421,244 386,249 C353,252 329,231 326,200 C325,178 340,159 362,152"/>
      <path stroke-width="30" d="M337,247 C329,293 318,337 302,368"/>
      <path stroke-width="30" d="M278,389 C287,400 307,406 333,404 C379,400 434,392 472,374"/>
    </g>
  </g>
</svg>
