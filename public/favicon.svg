<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img">
  <title>Tanish Logistic</title>
  <defs>
    <linearGradient id="gold" x1="256" y1="130" x2="256" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f9ecc0"/>
      <stop offset="38%" stop-color="#e8c877"/>
      <stop offset="72%" stop-color="#c79b4a"/>
      <stop offset="100%" stop-color="#9a7231"/>
    </linearGradient>
    <linearGradient id="ringGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2dd9e"/>
      <stop offset="55%" stop-color="#cba355"/>
      <stop offset="100%" stop-color="#8a6828"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1a1206" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fine outer ring -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="url(#ringGold)" stroke-width="3.5"/>

  <!-- Dotted transit orbit with route marker -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#d9b566" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="2.5 16" stroke-linecap="round"/>
  <circle cx="256" cy="46" r="9" fill="#f2dd9e" opacity="0.25"/>
  <circle cx="256" cy="46" r="5" fill="#f2dd9e"/>

  <!-- Road ribbon with lane dashes -->
  <path d="M102,396 Q246,344 390,396" fill="none" stroke="url(#ringGold)" stroke-width="7" stroke-linecap="round" stroke-dasharray="30 20"/>

  <!-- Hand-written TL monogram (bold strokes for small sizes) -->
  <g transform="translate(-26,0) skewX(6)" filter="url(#softShadow)">
    <g stroke="url(#gold)" stroke-width="40" stroke-linecap="round" fill="none">
      <path d="M207,146 V354"/>
      <path d="M117,146 H297"/>
      <path d="M303,146 V354"/>
      <path d="M303,354 H395"/>
    </g>
  </g>
</svg>
