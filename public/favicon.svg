<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Royal to Sapphire Midnight Gradient -->
    <linearGradient id="medallionBg" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="35%" stop-color="#0369a1"/>
      <stop offset="75%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Metallic Edge Ring Highlight -->
    <linearGradient id="edgeRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Chrome Platinum White Gradient -->
    <linearGradient id="whiteChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>

    <!-- Electric Cyan Highway Gradient -->
    <linearGradient id="cyanRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Drop Shadow for Monogram Depth -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#021a29" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="256" cy="256" r="236" fill="url(#medallionBg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#edgeRing)" stroke-width="4.5"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>

  <!-- Subtle Dashed Transit Orbit -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="14 10"/>

  <!-- Highway Speed Ribbon Arch at Base -->
  <path d="M 58 372 
           C 160 330 352 330 454 372 
           L 442 398 
           C 342 360 170 360 70 398 
           Z" 
        fill="url(#cyanRibbon)" opacity="0.95"/>

  <!-- Highway Center Lane Dashes -->
  <path d="M 125 366 C 175 349 225 344 256 344" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="14 12" stroke-linecap="round" opacity="0.9"/>
  <path d="M 276 344 C 305 344 345 349 387 366" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="14 12" stroke-linecap="round" opacity="0.9"/>

  <!-- Perfectly Centered Dynamic Slanted 'TL' Monogram -->
  <!-- Shifted -14px left for mathematical center -->
  <g transform="translate(242, 238) skewX(-12) translate(-242, -238)" filter="url(#badgeShadow)">
    <!-- Letter 'T' -->
    <path d="M 92 118 
             L 282 118 
             L 282 174 
             L 212 174 
             L 212 328 
             L 162 328 
             L 162 174 
             L 92 174 
             Z" 
          fill="url(#whiteChrome)"/>

    <!-- Letter 'L' (Interlocking alongside T) -->
    <path d="M 262 165 
             L 312 165 
             L 312 274 
             L 392 274 
             L 402 274 
             L 422 328 
             L 262 328 
             Z" 
          fill="url(#whiteChrome)"/>

    <!-- Electric Cyan Velocity Stripe inside L -->
    <polygon points="327,200 352,200 332,258 307,258" fill="url(#cyanRibbon)"/>
  </g>
</svg>